[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-router"
version = "0.3.0"
description = "A lightweight LLM router that classifies coding requests and routes them to the best-fit model using semantic similarity and cost-aware scoring."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Inder Sharma"},
]
keywords = ["llm", "router", "coding", "model-selection", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/indersharma/coding-router"
Repository = "https://github.com/indersharma/coding-router"

[project.scripts]
coding-router = "coding_router.__main__:main"

[project.entry-points.console_scripts]
coding-router = "coding_router.__main__:main"

[tool.setuptools.packages.find]
include = ["coding_router*"]

[tool.setuptools.package-data]
coding_router = ["data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
