name: Publish to PyPI

on:
  push:
    branches:
      - pip-package
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/pip-package'
    environment:
      name: pypi
    # PyPI Trusted Publisher must match exactly:
    # - owner: inder-dev-pro
    # - repository: coding-router
    # - workflow: .github/workflows/publish.yml
    # - environment: pypi
    
    # Required for PyPI Trusted Publishing (OIDC) - No secrets needed!
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        # No password needed when Trusted Publishing is configured on PyPI
